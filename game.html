<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITA — The Beginning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap');

  :root { --blue:#0057B8; --blue-dark:#123A6F; --blue-light:#EAF4FF; --white:#FFF;
    --text:#123A6F; --text-dim:rgba(18,58,111,0.55);
    --font-display:'Inter Tight',sans-serif; --font-body:'Manrope',sans-serif;
    --ease:cubic-bezier(0.19,1,0.22,1); }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0a1628; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:var(--font-body); overflow:hidden;
    cursor:none;
  }

  #container { position:relative; background:#000; }

  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none; z-index:10;
  }

  /* ── History screen: sun + hills backdrop with narrated founding story ── */
  .history-screen {
    position:absolute; inset:0; z-index:25; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end; text-align:center; cursor:pointer;
    padding-bottom:clamp(36px,9vh,88px);
    background:linear-gradient(to top, rgba(4,10,20,0.75) 0%, rgba(4,10,20,0.25) 45%, transparent 75%);
    transition:opacity 0.5s var(--ease);
  }
  .history-screen.hidden { opacity:0; pointer-events:none; }
  .history-card {
    opacity:0; transform:translateY(6px); transition:opacity 0.4s var(--ease), transform 0.4s var(--ease);
    max-width:560px; padding:0 24px;
  }
  .history-card.in { opacity:1; transform:translateY(0); }
  .history-year {
    font-family:var(--font-display); font-size:clamp(26px,3.6vw,40px); font-weight:800;
    letter-spacing:0.03em; color:#ffd97a; text-shadow:0 2px 16px rgba(0,0,0,0.5);
  }
  .history-text {
    font-family:var(--font-body); font-size:clamp(12px,1.4vw,15px); font-weight:400;
    color:#fff; line-height:1.7; margin-top:8px; text-shadow:0 2px 10px rgba(0,0,0,0.55);
  }
  .history-next {
    font-family:var(--font-body); font-size:clamp(8px,0.9vw,10px); font-weight:600;
    letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.65);
    margin-top:22px; animation:blink 1.3s ease-in-out infinite;
  }

  /* ── 2003 flash: quick pixel-title fade straight into gameplay ── */
  .year-flash {
    position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:clamp(64px,13vw,140px); color:#fff;
    background:#000; opacity:0; pointer-events:none; transition:opacity 0.5s ease;
  }
  .year-flash.show { opacity:1; }

  /* ── Story interludes (historical facts) + ending recap ── */
  .cinematic {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:linear-gradient(160deg,#fff 0%,var(--blue-light) 50%,#dcecf8 100%);
    z-index:20; gap:14px; padding:clamp(24px,6vh,48px);
    transition:opacity 0.6s var(--ease);
  }
  .cinematic.hidden { opacity:0; pointer-events:none; }

  .cin-logo {
    font-family:var(--font-display); font-size:clamp(11px,1.4vw,15px);
    font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--blue); margin-bottom:6px;
  }
  .cin-year {
    font-family:var(--font-display); font-size:clamp(56px,8vw,90px);
    font-weight:800; letter-spacing:-0.03em; line-height:1;
    color:var(--blue); animation:yearPulse 3s var(--ease) infinite;
  }
  @keyframes yearPulse {
    0%,100% { transform:scale(1); color:var(--blue); }
    50% { transform:scale(1.04); color:var(--blue-dark); }
  }
  .cin-title {
    font-family:var(--font-display); font-size:clamp(14px,1.8vw,20px);
    font-weight:600; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--blue-dark); text-align:center;
  }
  .cin-divider { width:48px; height:2px; background:var(--blue); border-radius:1px; margin:2px 0; }
  .cin-story {
    font-family:var(--font-body); font-size:clamp(11px,1.3vw,14px); font-weight:400;
    color:var(--text-dim); text-align:center; line-height:1.9; max-width:560px;
  }
  .cin-btn {
    font-family:var(--font-body); font-size:clamp(10px,1.1vw,13px); font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase;
    color:var(--white); background:var(--blue); border:none;
    border-radius:100px; padding:12px 36px; cursor:pointer;
    pointer-events:auto; transition:all 0.35s var(--ease); margin-top:6px;
  }
  .cin-btn:hover { background:var(--blue-dark); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,87,184,0.25); }
  .cin-sub {
    font-family:var(--font-body); font-size:clamp(8px,0.9vw,11px); font-weight:500;
    letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim);
  }

  /* ── End-of-level fade to black + title card ── */
  .end-fade {
    position:absolute; inset:0; z-index:18; background:#000; opacity:0;
    transition:opacity 1.8s var(--ease); pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .end-fade.on { opacity:1; }
  .end-fade-text {
    font-family:var(--font-display); font-size:clamp(20px,3vw,34px); font-weight:600;
    letter-spacing:0.08em; color:#fff; opacity:0; transition:opacity 1.6s var(--ease) 0.6s;
    text-align:center;
  }
  .end-fade.on .end-fade-text { opacity:1; }

  .dialogue {
    position:absolute; bottom:clamp(12px,2.5vh,24px); left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.94); backdrop-filter:blur(12px);
    border:1.5px solid rgba(0,87,184,0.15); border-radius:16px;
    padding:16px 24px; z-index:15; pointer-events:auto;
    width:82%; max-width:640px; display:none;
    box-shadow:0 8px 32px rgba(0,87,184,0.08);
  }
  .dialogue.active { display:block; }
  .dialogue-name {
    font-family:var(--font-display); font-size:clamp(9px,0.85vw,11px); font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--blue); margin-bottom:4px;
  }
  .dialogue-text {
    font-family:var(--font-body); font-size:clamp(11px,1.2vw,14px); font-weight:500;
    color:var(--text); line-height:1.8; margin-bottom:8px;
  }
  .dialogue-continue {
    font-family:var(--font-body); font-size:clamp(8px,0.8vw,10px); font-weight:600;
    letter-spacing:0.12em; text-transform:uppercase;
    color:var(--blue); text-align:right;
    animation:blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ── Dialogue choices: response options the player can pick ── */
  .dialogue-choices { display:none; margin-top:2px; }
  .dialogue-choices.active { display:block; }
  .dialogue-choice {
    font-family:var(--font-body); font-size:clamp(10px,1.1vw,13px); font-weight:500;
    color:var(--text-dim); padding:5px 8px; border-radius:8px; margin-top:2px;
    transition:background 0.15s var(--ease), color 0.15s var(--ease);
  }
  .dialogue-choice.sel { background:rgba(0,87,184,0.10); color:var(--blue-dark); font-weight:700; }

  /* ── Task bar: current objective only, top of screen ── */
  .taskbar {
    position:absolute; top:clamp(10px,2.2vh,20px); left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border:1.5px solid rgba(0,87,184,0.15); border-radius:100px;
    padding:8px 20px; z-index:14; pointer-events:none;
    white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,87,184,0.10);
    opacity:0; transition:opacity 0.4s var(--ease);
  }
  .taskbar.show { opacity:1; }
  .taskbar-task {
    font-family:var(--font-display); font-size:clamp(9px,1vw,12px); font-weight:700;
    letter-spacing:0.03em; color:var(--blue-dark);
  }

  /* ── Hotbar: Minecraft-style inventory slots, bottom of screen ── */
  .hotbar {
    position:absolute; bottom:clamp(10px,2.6vh,22px); left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:14; pointer-events:none;
    opacity:0; transition:opacity 0.4s var(--ease);
  }
  .hotbar.show { opacity:1; }
  .hotbar-slot {
    width:clamp(36px,6.5vw,48px); height:clamp(36px,6.5vw,48px);
    background:rgba(22,22,30,0.6); border:2px solid rgba(255,255,255,0.2);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), inset 2px 2px 0 rgba(255,255,255,0.08), 0 3px 10px rgba(0,0,0,0.35);
    border-radius:5px; position:relative; display:flex; align-items:center; justify-content:center;
  }
  .hotbar-icon { width:56%; height:68%; image-rendering:pixelated; }
  .hotbar-icon-wheat { background:#e8b923; clip-path: polygon(50% 0%, 78% 22%, 62% 42%, 88% 58%, 68% 74%, 82% 100%, 50% 82%, 18% 100%, 32% 74%, 12% 58%, 38% 42%, 22% 22%); }
  .hotbar-icon-milk { background:linear-gradient(#f4fbff,#cfe8f5); border:2px solid #7fa8c9; clip-path: polygon(30% 0%,70% 0%,70% 16%,92% 32%,92% 100%,8% 100%,8% 32%,30% 16%); }
  .hotbar-count {
    position:absolute; bottom:1px; right:3px; font-family:var(--font-display); font-weight:800;
    font-size:clamp(9px,1.3vw,14px); color:#fff;
    text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000;
  }
</style>
</head>
<body>

<div id="container">
  <canvas id="game"></canvas>

  <div class="history-screen" id="historyScreen">
    <div class="history-card" id="historyCard">
      <div class="history-year" id="historyYear"></div>
      <div class="history-text" id="historyText"></div>
      <div class="history-next">Press Enter or Click to Continue</div>
    </div>
  </div>

  <div class="year-flash" id="yearFlash">2003</div>

  <div class="cinematic hidden" id="cinematic"></div>

  <div class="end-fade" id="endFade"><div class="end-fade-text" id="endFadeText">The Journey Begins&hellip;</div></div>

  <div class="taskbar" id="taskBar">
    <div class="taskbar-task" id="taskBarText">&mdash;</div>
  </div>

  <div class="hotbar" id="hotbar">
    <div class="hotbar-slot"><div class="hotbar-icon hotbar-icon-wheat"></div><div class="hotbar-count" id="hotbarWheat">0</div></div>
    <div class="hotbar-slot"><div class="hotbar-icon hotbar-icon-milk"></div><div class="hotbar-count" id="hotbarMilk">0</div></div>
  </div>

  <div class="dialogue" id="dialogue">
    <div class="dialogue-name" id="dialogueName"></div>
    <div class="dialogue-text" id="dialogueText"></div>
    <div class="dialogue-choices" id="dialogueChoices"></div>
    <div class="dialogue-continue" id="dialogueContinue">&#9660; Press Enter</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// VITA — LEVEL 1: THE FIRST DROP
// Nintendo-quality pixel-art story game
// ═══════════════════════════════════════════

const GW = 480, GH = 270; // internal resolution
const TILE = 16;
let scale, containerW, containerH;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = GW; canvas.height = GH;
ctx.imageSmoothingEnabled = false;

const container = document.getElementById('container');

function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(Math.floor(ww / GW), Math.floor(wh / GH)) || 1;
  containerW = GW * scale; containerH = GH * scale;
  container.style.width = containerW + 'px';
  container.style.height = containerH + 'px';
  canvas.style.width = containerW + 'px';
  canvas.style.height = containerH + 'px';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('fullscreenchange', resize);

// ── FULLSCREEN (requested on the player's first click/keypress — browsers require a user gesture) ──
let fullscreenRequested = false;
function tryFullscreen(){
  if(fullscreenRequested) return; fullscreenRequested = true;
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

const $ = s => document.querySelector(s);
const diaBox = $('#dialogue'), diaText = $('#dialogueText'), diaName = $('#dialogueName');
const diaChoices = $('#dialogueChoices'), diaContinue = $('#dialogueContinue');
const cinematic = $('#cinematic');
const historyScreen = $('#historyScreen'), historyCard = $('#historyCard'), historyYear = $('#historyYear'), historyText = $('#historyText');
const yearFlash = $('#yearFlash');
const endFade = $('#endFade'), endFadeText = $('#endFadeText');
const taskBar = $('#taskBar'), taskBarText = $('#taskBarText');
const hotbar = $('#hotbar'), hotbarWheat = $('#hotbarWheat'), hotbarMilk = $('#hotbarMilk');

// ── AMBIENT AUDIO (procedural — no external assets) ──
let actx=null, masterGain=null, audioReady=false;
function initAudio(){
  if(audioReady) return; audioReady=true;
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = actx.createGain(); masterGain.gain.value=0.55; masterGain.connect(actx.destination);
    startWind(); scheduleBirds(); startAmbientMusic();
  }catch(e){}
}
function unlockAudio(){ if(actx && actx.state==='suspended') actx.resume(); }
function startWind(){
  const bufSize = actx.sampleRate*2;
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer=buf; src.loop=true;
  const filter = actx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=340;
  const g = actx.createGain(); g.gain.value=0.045;
  src.connect(filter); filter.connect(g); g.connect(masterGain); src.start();
}
function chirp(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; const base=1700+Math.random()*900;
  o.frequency.setValueAtTime(base, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(base*0.6, actx.currentTime+0.12);
  g.gain.setValueAtTime(0.0001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.05, actx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.15);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(actx.currentTime+0.16);
}
function scheduleBirds(){
  setInterval(()=>{ if(!actx)return; if(Math.random()<0.55) chirp(); if(Math.random()<0.25) setTimeout(chirp,140); },1700);
}
function footstepSound(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.value=85+Math.random()*18;
  g.gain.setValueAtTime(0.045, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.07);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(actx.currentTime+0.08);
}
function cowbellSound(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle'; o.frequency.value=520;
  g.gain.setValueAtTime(0.07, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.4);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(actx.currentTime+0.4);
}
function chimeSound(){
  if(!actx) return;
  [660,880,990].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=f;
    const t=actx.currentTime+i*0.08;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.06,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.5);
  });
}
function milkSound(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(300,actx.currentTime); o.frequency.exponentialRampToValueAtTime(170,actx.currentTime+0.15);
  g.gain.setValueAtTime(0.06,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.18);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(actx.currentTime+0.2);
}
function pickupSound(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(520,actx.currentTime); o.frequency.exponentialRampToValueAtTime(880,actx.currentTime+0.1);
  g.gain.setValueAtTime(0.05,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.13);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(actx.currentTime+0.14);
}
function petSound(){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(700,actx.currentTime); o.frequency.exponentialRampToValueAtTime(950,actx.currentTime+0.08);
  g.gain.setValueAtTime(0.045,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.12);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(actx.currentTime+0.13);
}
function startAmbientMusic(){
  const notes=[261.6,293.7,329.6,392.0,440.0,523.3];
  function playNote(){
    if(!actx) return;
    const f = notes[Math.floor(Math.random()*notes.length)];
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=f;
    const t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.032,t+0.5); g.gain.exponentialRampToValueAtTime(0.0001,t+3.6);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+3.7);
    setTimeout(playNote, 1900+Math.random()*2300);
  }
  playNote();
}
window.addEventListener('keydown', unlockAudio, {once:true});
window.addEventListener('click', unlockAudio, {once:true});

// ── GAME STATE ──
const S = {
  intro:true, playing:false, dialogue:false,
  dialogueQueue:[], diaCb:null, diaSpeaker:'',
  choiceOptions:null, choiceIndex:0, choiceSpeaker:'',
  px:140, py:0, vx:0, vy:0, facing:1, onGround:false, jumping:false,
  animFrame:0, animTimer:0,
  currentTask:0, taskProgress:0, taskTarget:0,
  cowFed:false, metFarmer:false, milkHold:0, wheatHold:0, milkReady:false,
  inventory:{wheat:0, milk:0},
  scene:'outside', sceneCooldown:0,
  camX:0, camY:0, particles:[], floatTexts:[], smoke:[], leaves:[], dust:[], keys:{}, levelComplete:false,
  time:0, villageLife:0, petCooldown:0,
};

// ── WORLD ──
const MAP_W = 100, MAP_H = 28;
let map = [];
let wheatItems = [], cowPositions = [], chickenPositions = [], sheepPositions = [], butterflies = [];
let deliveryHouses = [], farmCow = null, farmerNPC = null;
let worldObjects = [];
let villagerPositions = [];

// ── BARN — a separate interior scene, entered/exited by pressing E at the door ──
const BARN_X = 370;              // world px, center of the exterior sprite — past the wheat field, not right at spawn
const BARN_DOOR_X = BARN_X + 14; // exterior door, offset toward the wheat field
const ROOM_W_TILES = Math.ceil(GW/TILE); // interior fills the screen — a small, cozy, non-scrolling room
const INTERIOR_DOOR_X = 34;      // interior px, where the door sits (left wall)

function buildWorld() {
  map = Array.from({length:MAP_H}, () => Array(MAP_W).fill('.'));
  for (let y=0; y<MAP_H; y++)
    for (let x=0; x<MAP_W; x++) {
      if (y >= MAP_H-4) map[y][x] = 'G';
      if (y >= MAP_H-2) map[y][x] = 'D';
    }
  for (let x=0; x<18; x+=2) map[MAP_H-4][x] = 'F';

  // a worn dirt trail meandering through the grass, connecting the landmarks — not a full ground override
  for (let x=20; x<98; x++) {
    const w = Math.sin(x*0.35) + Math.sin(x*0.12+2);
    if (w > 0.3) map[MAP_H-4][x] = 'R';
  }

  for (let wx=14; wx<=19; wx++)
    for (let wy=MAP_H-6; wy<=MAP_H-5; wy++)
      map[wy][wx] = 'W';

  for (let hx=70; hx<=74; hx++)
    for (let hy=MAP_H-10; hy<=MAP_H-5; hy++)
      map[hy][hx] = 'H';
  for (let hx=82; hx<=86; hx++)
    for (let hy=MAP_H-9; hy<=MAP_H-5; hy++)
      map[hy][hx] = 'H';

  worldObjects = [];
  const treePos = [10,11,22,24,28,30,32,35,38,40,
    48,50,55,58,60,62,64,68,76,78,80,88,92];
  for (const tx of treePos) {
    const t = tx % 5 === 0 ? 'pine' : tx % 3 === 0 ? 'apple' : 'oak';
    worldObjects.push({type:'tree', variant:t, x:tx*TILE + TILE/2, seed:Math.random()*Math.PI*2});
  }

  for (let i=0; i<34; i++) {
    const bx = 5 + Math.floor(Math.random()*90);
    worldObjects.push({type:'bush', x:bx*TILE + 4 + Math.random()*8});
  }
  for (let i=0; i<22; i++) {
    const rx = 3 + Math.floor(Math.random()*94);

function updateTaskBar() {

  const fn = TASK_LABELS[S.currentTask];
  taskBarText.textContent = fn ? fn() : '';

  hotbarWheat.textContent = S.inventory.wheat;

}

// ── PLAYER ──
const PW=14, PH=18, GRAVITY=0.4, SPEED=1.4, JUMP=-4.4;

function drawPlayer(px, py) {
  const f=S.facing, a=S.animFrame;
  const walk = Math.floor(a/6)%4;
  const legOff = walk===1?1:walk===3?-1:0;
  const armOff = walk===2?1:walk===0?-1:0;
  const bx = px, by = py;

  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(bx-2, by+PH-1, PW+4, 3);
  ctx.fillStyle='#3a2510'; ctx.fillRect(bx+3, by+PH-4+legOff, 4, 4); ctx.fillRect(bx+8, by+PH-4-legOff, 4, 4);
  ctx.fillStyle='#2a5090'; ctx.fillRect(bx+3, by+PH-8+legOff, 4, 5); ctx.fillRect(bx+8, by+PH-8-legOff, 4, 5);
  ctx.fillStyle='#0057B8'; ctx.fillRect(bx+2, by+4, 10, 10);
  ctx.fillStyle='#0068d0'; ctx.fillRect(bx+3, by+7, 8, 2);
  ctx.fillStyle='#3a2510'; ctx.fillRect(bx+2, by+10, 10, 1);
  ctx.fillStyle='#f5f2e8'; ctx.fillRect(bx+2, by+1, 10, 4);
  ctx.fillStyle='#d4a574'; ctx.fillRect(bx, by+4+armOff, 2, 5); ctx.fillRect(bx+PW-2, by+4-armOff, 2, 5);
  ctx.fillStyle='#d4a574'; ctx.fillRect(bx-1, by+8+armOff, 3, 2); ctx.fillRect(bx+PW-2, by+8-armOff, 3, 2);
  ctx.fillStyle='#d4a574'; ctx.fillRect(bx+3, by-PH+14, 8, 8);
  ctx.fillStyle='#3a2510'; ctx.fillRect(bx+3, by-PH+14, 8, 3); ctx.fillRect(bx+2, by-PH+15, 10, 2);
  const ex = f===1?bx+8:bx+4;
  ctx.fillStyle='#1a0a00'; ctx.fillRect(ex, by-PH+18, 2, 2);
  ctx.fillStyle='#8B6914'; ctx.fillRect(bx+1, by-PH+11, 12, 3); ctx.fillRect(bx+3, by-PH+13, 8, 2);
}

// ── FARMER NPC (idle, warm — the human heart of the story) ── pal lets villagers reuse this sprite recolored

  ctx.fillStyle=c.pantsHi; ctx.fillRect(bx+3, by+PH-8, 4, 5); ctx.fillRect(bx+8, by+PH-8, 4, 5);
  ctx.fillStyle=c.shirt; ctx.fillRect(bx+2, by+4, 10, 10);
  ctx.fillStyle=c.shirtHi; ctx.fillRect(bx+3, by+7, 8, 2);
  ctx.fillStyle=c.collar; ctx.fillRect(bx+2, by+1, 10, 4);
  ctx.fillStyle=c.sleeve; ctx.fillRect(bx, by+4, 2, 5); ctx.fillRect(bx+PW-2, by+4, 2, 5);

function drawButterfly(bx, by, wing, hue) {

  ctx.fillStyle='#333'; ctx.fillRect(bx-1, by-2, 1, 4);
}

// ── ENVIRONMENT DRAWING ──
function groundShadow(sx, gy, w) {
  // soft two-tier blob instead of a hard rectangle — reads as contact AO, not a pasted-on sticker
  ctx.fillStyle='rgba(20,28,12,0.10)'; ctx.fillRect(sx-w/2-1, gy-4, w+2, 5);
  ctx.fillStyle='rgba(20,28,12,0.22)'; ctx.fillRect(sx-w/2+2, gy-3, w-4, 4);
}

function drawTree(sx, sy, v, sway) {
  sway = sway||0;
  ctx.fillStyle='#6B4226'; ctx.fillRect(sx-2, sy+8, 4, 16);
  ctx.fillStyle='#8B5A2E'; ctx.fillRect(sx-1, sy+10, 2, 12);
  const cx = sx+sway;
  if (v==='pine') {
    ctx.fillStyle='#2d5a1e'; ctx.fillRect(cx-10, sy-4, 20, 12);
    ctx.fillStyle='#3a7028'; ctx.fillRect(cx-8, sy-10, 16, 10);
    ctx.fillStyle='#4a8535'; ctx.fillRect(cx-5, sy-14, 10, 8);
  } else if (v==='apple') {
    ctx.fillStyle='#4a7a30'; ctx.fillRect(cx-8, sy-6, 16, 16);
    ctx.fillStyle='#5a9038'; ctx.fillRect(cx-6, sy-8, 12, 14);
    ctx.fillStyle='#d03030'; ctx.fillRect(cx-3, sy-2, 2, 2); ctx.fillRect(cx+4, sy, 2, 2); ctx.fillRect(cx, sy-5, 2, 2);
    ctx.fillStyle='#e84040'; ctx.fillRect(cx-2, sy-1, 1, 1); ctx.fillRect(cx+5, sy+1, 1, 1);
  } else {
    ctx.fillStyle='#3a6a20'; ctx.fillRect(cx-9, sy-2, 18, 18);
    ctx.fillStyle='#4a8030'; ctx.fillRect(cx-7, sy-4, 14, 16);
    ctx.fillStyle='#5a903a'; ctx.fillRect(cx-4, sy-6, 8, 12);
  }
}

function drawRockyHill(sx, gy, seed) {
  seed = seed||0;
  groundShadow(sx, gy, 78);
  // stacked, unevenly-offset bands fake a rounded natural mound instead of a block
  const bands = [
    {w:70, h:11, dx:0,  c:'#8a8478'},
    {w:60, h:10, dx:-3, c:'#948877'},
    {w:48, h:10, dx:4,  c:'#a0947e'},
    {w:36, h:9,  dx:-2, c:'#ab9d84'},
    {w:22, h:8,  dx:2,  c:'#b6a88c'},
  ];
  let y = gy;
  for (const b of bands) {
    y -= b.h;
    ctx.fillStyle = b.c;
    ctx.fillRect(sx-b.w/2+b.dx, y, b.w, b.h);
  }
  // jagged rock chunks broken off the silhouette so it doesn't read as blocky
  ctx.fillStyle='#767064';
  ctx.fillRect(sx-33, gy-9, 7, 9); ctx.fillRect(sx+24, gy-7, 8, 7); ctx.fillRect(sx-12, gy-45, 6, 7);
  ctx.fillStyle='#a2947f';
  ctx.fillRect(sx-27, gy-16, 5, 6); ctx.fillRect(sx+17, gy-22, 6, 6); ctx.fillRect(sx-3, gy-40, 5, 5);
  ctx.fillStyle='#6a655a';
  ctx.fillRect(sx-20, gy-6, 4, 3); ctx.fillRect(sx+8, gy-4, 4, 3);

  // greenery: moss patches down the slope + grass crown + a bush clinging to the side
  ctx.fillStyle='#5a8a3e';
  ctx.fillRect(sx-24, gy-20, 8, 5); ctx.fillRect(sx+10, gy-14, 9, 5); ctx.fillRect(sx-4, gy-32, 7, 5);
  ctx.fillStyle='#6a9a48';
  ctx.fillRect(sx-22, gy-21, 5, 3); ctx.fillRect(sx+12, gy-15, 5, 3);
  ctx.fillStyle='#4a7a30'; ctx.fillRect(sx-7, gy-42, 12, 6);
  ctx.fillStyle='#5a9038'; ctx.fillRect(sx-5, gy-44, 8, 5);
  for (let i=0; i<6; i++) {
    const tx = -30 + i*11 + Math.sin(seed+i)*3;
    const ty = -18 - (i%3)*7;
    const sway = Math.sin(S.time*0.03 + seed + i)*0.8;
    ctx.fillStyle='#6a9a48'; ctx.fillRect(sx+tx+sway, gy+ty, 2, 5);
    ctx.fillStyle='#7aaa54'; ctx.fillRect(sx+tx+sway, gy+ty-2, 2, 3);
  }
  const bx = sx-30, by = gy-6;
  ctx.fillStyle='#5a8a3e'; ctx.fillRect(bx-5, by-7, 10, 7);
  ctx.fillStyle='#6a9a48'; ctx.fillRect(bx-3, by-9, 6, 4);
}

function drawWindmill(sx, gy, time) {
  const h=52;
  groundShadow(sx, gy, 24);
  ctx.fillStyle='#8a7454'; ctx.fillRect(sx-10, gy-14, 20, 14);
  ctx.fillStyle='#c9b896'; ctx.fillRect(sx-9, gy-h, 18, h-14);
  ctx.fillStyle='#b8a582'; ctx.fillRect(sx-9, gy-h, 4, h-14);
  ctx.fillStyle='#5a4a34'; ctx.fillRect(sx-3, gy-11, 6, 11);
  ctx.fillStyle='#7a4a30'; ctx.fillRect(sx-11, gy-h-7, 22, 9);
  ctx.fillStyle='#5a3320'; ctx.fillRect(sx-6, gy-h-13, 12, 8);
  ctx.save();
  ctx.translate(sx, gy-h+3);
  ctx.rotate(time*0.025);
  for (let i=0; i<4; i++) {
    ctx.save(); ctx.rotate(i*Math.PI/2);
    ctx.fillStyle='#e8ddc8'; ctx.fillRect(-3, -26, 6, 25);
    ctx.fillStyle='#d0c4a8'; ctx.fillRect(-2, -24, 4, 21);
    ctx.restore();
  }
  ctx.fillStyle='#6b5a3a'; ctx.fillRect(-2,-2,4,4);
  ctx.restore();
}

function drawBarnExterior(sx, gy) {
  groundShadow(sx, gy, 100);
  const wallW=92, wallH=34, wallTop=gy-wallH;
  // stone-brick lower wall, coursed brick texture
  ctx.fillStyle='#8a8478'; ctx.fillRect(sx-wallW/2, wallTop, wallW, wallH);
  ctx.fillStyle='#96907f'; ctx.fillRect(sx-wallW/2, wallTop, wallW, 3);
  ctx.fillStyle='#7a7468';
  for (let row=0; row<5; row++) {
    const ry = wallTop+5+row*6, offset = row%2===0?0:5;
    for (let bx=-wallW/2+offset; bx<wallW/2-2; bx+=10) ctx.fillRect(sx+bx, ry, 8, 4);
  }
  // gable roof — a stacked, tapering silhouette of wood shingles (not a flat block)
  const roofBaseW=106, roofH=36, roofBaseY=wallTop+2, bands=8;
  for (let i=0;i<bands;i++){
    const t=i/bands, t2=(i+1)/bands;
    const w = roofBaseW*(1-t)+16*t;
    const y = roofBaseY - roofH*t2;
    const h = roofH*(t2-t)+1;
    ctx.fillStyle = i%2===0? '#6b3a28':'#78422e';
    ctx.fillRect(sx-w/2, y, w, h);
  }
  ctx.fillStyle='#5a3320'; ctx.fillRect(sx-9, roofBaseY-roofH-2, 18, 4); // ridge cap
  // chimney, poking through the left slope
  const chimTop = roofBaseY-roofH*0.62-16;
  ctx.fillStyle='#847e70'; ctx.fillRect(sx-31, chimTop, 10, roofBaseY-roofH*0.62-chimTop+18);
  ctx.fillStyle='#6a6458'; ctx.fillRect(sx-31, chimTop-2, 10, 3);
  ctx.fillStyle='#2a2620'; ctx.fillRect(sx-29, chimTop+1, 6, 4);
  // window
  ctx.fillStyle='#5a3f22'; ctx.fillRect(sx-27, wallTop+9, 15, 15);
  ctx.fillStyle='#bfe0f0'; ctx.fillRect(sx-25, wallTop+11, 11, 11);
  ctx.fillStyle='#e8f6ff'; ctx.fillRect(sx-24, wallTop+12, 4, 4);
  ctx.fillStyle='#5a3f22'; ctx.fillRect(sx-25, wallTop+16, 11, 2); ctx.fillRect(sx-20, wallTop+11, 2, 11);
  // door (the interactive entry point — sits at BARN_DOOR_X)
  const doorDx = BARN_DOOR_X-BARN_X;
  ctx.fillStyle='#3a2414'; ctx.fillRect(sx+doorDx-9, gy-23, 18, 23);
  ctx.fillStyle='#5c3a24'; ctx.fillRect(sx+doorDx-8, gy-22, 16, 22);
  ctx.fillStyle='#4a2f1c'; ctx.fillRect(sx+doorDx-8, gy-22, 16, 2); ctx.fillRect(sx+doorDx-1, gy-22, 2, 22);
  ctx.fillStyle='#d8b878'; ctx.fillRect(sx+doorDx+4, gy-13, 2, 2);
}

function drawStream(sx, gy, w) {

  const g = ctx.createLinearGradient(sx-w/2, gy, sx+w/2, gy);
  g.addColorStop(0,'#4a7ea8'); g.addColorStop(Math.max(0,shimmer-0.1),'#5a8eb8'); g.addColorStop(shimmer,'#a8d4ec'); g.addColorStop(Math.min(1,shimmer+0.1),'#5a8eb8'); g.addColorStop(1,'#4a7ea8');
  ctx.fillStyle=g; ctx.fillRect(sx-w/2, gy-4, w, 5);
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(sx-w/2+4, gy-3, w-8, 1);
  ctx.fillStyle='#9c9282'; ctx.fillRect(sx-w/4-2, gy-4, 5, 3); ctx.fillRect(sx+w/5, gy-3, 4, 2);
}

function drawTile(t,sx,sy,tx,ty) {
  const TS=TILE;
  switch(t) {
    case 'G': { const gv=(tx*13+ty*7)%5;
              ctx.fillStyle=gv<2?'#82b45a':gv<4?'#78ab52':'#8cbc62'; ctx.fillRect(sx,sy,TS,TS);
              ctx.fillStyle='#72a44a'; ctx.fillRect(sx,sy,TS,3);
              const gsway = Math.sin(S.time*0.04 + tx*0.6)*1.2;
              if((tx+ty)%3===0){ctx.fillStyle='#92c46a';ctx.fillRect(sx+4+gsway,sy-2,2,4);}
              if((tx+ty)%4===1){ctx.fillStyle='#92c46a';ctx.fillRect(sx+12+gsway,sy-1,2,3);}
              if((tx+ty)%7===2){ctx.fillStyle='#6a9c42';ctx.fillRect(sx+8+gsway*0.5,sy-1,2,3);} break; }
    case 'D': { const dv=(tx*11+ty*17)%4;
              ctx.fillStyle=dv===0?'#9B8030':dv===1?'#8f7529':'#a68a38'; ctx.fillRect(sx,sy,TS,TS);
              ctx.fillStyle='#806820'; ctx.fillRect(sx,sy,TS,4);
              ctx.fillStyle='rgba(60,42,16,0.18)'; ctx.fillRect(sx,sy+11,TS,2);
              if((tx+ty)%5===0){ctx.fillStyle='#ab9040';ctx.fillRect(sx+4,sy+8,2,2);}
              if((tx+ty)%6===3){ctx.fillStyle='#c0a850';ctx.fillRect(sx+10,sy+3,2,2);} break; }
    case 'F': ctx.fillStyle='#82b45a'; ctx.fillRect(sx,sy,TS,TS);
              ctx.fillStyle='#8B6914'; ctx.fillRect(sx+6,sy-6,4,22); ctx.fillRect(sx+1,sy+6,14,2); ctx.fillRect(sx+1,sy+12,14,2); break;
    case 'W': ctx.fillStyle='#8a7a20'; ctx.fillRect(sx,sy,TS,TS);
              ctx.fillStyle='#b89830';ctx.fillRect(sx+2,sy+2,2,8);ctx.fillRect(sx+8,sy+3,2,7);ctx.fillRect(sx+13,sy+1,2,9); break;
    case 'H': ctx.fillStyle='#f8f6f0'; ctx.fillRect(sx,sy,TS,TS);
              if((tx>=71&&tx<=73||tx>=83&&tx<=85)&&(ty===MAP_H-9||ty===MAP_H-7)){
                ctx.fillStyle=window.__villageLife>=3?'#ffe9a8':'#c8ddf0';ctx.fillRect(sx+4,sy+4,8,8);
                ctx.fillStyle='#0057B8';ctx.fillRect(sx+4,sy+4,8,1);ctx.fillRect(sx+4,sy+4,1,8);ctx.fillRect(sx+7,sy+4,1,8);}
              if(ty===MAP_H-10){ctx.fillStyle='#0057B8';ctx.fillRect(sx-2,sy,TS+4,4);ctx.fillRect(sx,sy-2,TS,4);} break;
    case 'R': ctx.fillStyle='#b09840'; ctx.fillRect(sx,sy,TS,TS);
              ctx.fillStyle='#a08830'; ctx.fillRect(sx,sy+4,TS,2);
              if((tx+ty)%4===0){ctx.fillStyle='#c0a850';ctx.fillRect(sx+3,sy+2,3,2);}
              // grass fringe so the path blends into the surrounding field instead of a hard edge
              if(map[ty-1] && map[ty-1][tx]!=='R'){ctx.fillStyle='#72a44a';ctx.fillRect(sx,sy,TS,2);}
              if(map[ty] && map[ty][tx-1]!=='R' && map[ty][tx-1]!=='H' && map[ty][tx-1]!=='B'){ctx.fillStyle='#82b45a';ctx.fillRect(sx,sy,2,TS);}
              if(map[ty] && map[ty][tx+1]!=='R' && map[ty][tx+1]!=='H' && map[ty][tx+1]!=='B'){ctx.fillStyle='#82b45a';ctx.fillRect(sx+TS-2,sy,2,TS);} break;
  }
}

// a continuous ridge silhouette (single filled path, not stacked columns) so it reads as terrain, not a skyline
function drawRidge(cx, baseY, amp1, amp2, freq1, freq2, phase, parallax, step, color) {
  const camOff = cx*parallax;
  ctx.beginPath();
  ctx.moveTo(-4, GH+10);
  for (let sx=-4; sx<=GW+4; sx+=step) {
    const wx = sx + camOff;
    const h = baseY - Math.sin((wx+phase)*freq1)*amp1 - Math.sin((wx+phase)*freq2)*amp2;
    ctx.lineTo(sx, h);
  }
  ctx.lineTo(GW+4, GH+10);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function fogBand(y0, y1, alpha) {
  const fog = ctx.createLinearGradient(0, y0, 0, y1);
  fog.addColorStop(0, 'rgba(225,238,236,0)'); fog.addColorStop(0.5, `rgba(225,238,236,${alpha})`); fog.addColorStop(1, 'rgba(225,238,236,0)');
  ctx.fillStyle=fog; ctx.fillRect(0, y0, GW, y1-y0);
}

function drawWorld(cx, cy) {
  // crisp sky only occupies the top third — the rest of the frame is layered terrain, not empty blue.
  // one continuous gradient (not two abutting rects) so there's no seam at the join.
  const sky = ctx.createLinearGradient(0,0,0,GH);
  sky.addColorStop(0,'#2f5fa8'); sky.addColorStop(0.19,'#5f8fd0'); sky.addColorStop(0.34,'#8fb8e6');
  sky.addColorStop(0.46,'#bcd8ec'); sky.addColorStop(0.66,'#dcecdc'); sky.addColorStop(1,'#c8dcc0');
  ctx.fillStyle=sky; ctx.fillRect(0,0,GW,GH);

  const sunX = 320 - cx*0.05, sunY = 24;
  ctx.fillStyle='rgba(255,252,235,0.3)'; ctx.fillRect(sunX-12, sunY-12, 28, 28);
  ctx.fillStyle='#fffdf0'; ctx.fillRect(sunX-6, sunY-6, 14, 14);
  ctx.fillStyle='#ffffff'; ctx.fillRect(sunX-3, sunY-3, 8, 8);
  // soft sunlight glow washing down across the whole scene
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 240);
  sunGlow.addColorStop(0, 'rgba(255,248,222,0.22)'); sunGlow.addColorStop(1, 'rgba(255,248,222,0)');
  ctx.fillStyle=sunGlow; ctx.fillRect(0,0,GW,GH);

  for (let i=0; i<6; i++) {
    const clX = ((i*120 + S.time*0.08 + 200) % (GW+200)) - 100 - cx*0.1;
    const clY = 10 + i*11;
    const w = 18 + i*10;
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(clX, clY, w, 7);
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillRect(clX+4, clY-3, w-6, 5);
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fillRect(clX+2, clY+3, w-4, 3);
  }

  // ── layered depth: far mountains → rolling hills → forest silhouette → farmland, each its own parallax speed ──
  drawRidge(cx, 96, 20, 13, 0.045, 0.019, 0,   0.05, 6, '#8a8fbc');
  fogBand(78, 118, 0.30);
  drawRidge(cx, 128, 15, 11, 0.05, 0.024,  40,  0.13, 6, '#8fae7a');
  drawRidge(cx, 152, 13, 8,  0.06, 0.03,   90,  0.20, 5, '#79a566');
  fogBand(132, 168, 0.22);
  // forest silhouette — a smooth ridge base with a fine jagged crown texture riding on top
  drawRidge(cx, 176, 8, 5, 0.07, 0.035, 15, 0.32, 4, '#3d6132');
  ctx.fillStyle='#2f4f26';
  for (let mx=-10; mx<GW+10; mx+=5) {
    const wx = mx + cx*0.32;
    const base = 176 - Math.sin((wx+15)*0.07)*8 - Math.sin((wx+15)*0.035)*5;
    const bump = 2 + ((Math.sin(wx*1.3)+1)*2);
    ctx.fillRect(mx, base-bump, 3, bump+2);
  }
  // farmland strip — a thin band of gently rolling fields with faint plowed-row striping
  drawRidge(cx, 200, 5, 3, 0.09, 0.045, 60, 0.5, 5, '#8caa54');
  ctx.fillStyle='rgba(70,92,42,0.30)';
  for (let mx=-6; mx<GW+6; mx+=6) {
    const mxA = mx - (cx*0.5)%6;
    ctx.fillRect(mxA, 197, 1, 9);
  }
  fogBand(184, 206, 0.14);

  const stx=Math.max(0,Math.floor(cx/TILE)-1), etx=Math.min(MAP_W,Math.ceil((cx+GW)/TILE)+1);
  const sty=Math.max(0,Math.floor(cy/TILE)-1), ety=Math.min(MAP_H,Math.ceil((cy+GH)/TILE)+1);

  window.__villageLife = S.villageLife;
  for (let ty=sty; ty<ety; ty++)
    for (let tx=stx; tx<etx; tx++) {
      const sx=tx*TILE-cx, sy=ty*TILE-cy+GH-MAP_H*TILE;
      drawTile(map[ty][tx], sx, sy, tx, ty);
    }

  // groundSy = screen-y of the grass surface line — every ground object's feet sit here
  const groundSy = GH - 4*TILE - cy;

  // soil cross-section: roots dangling from the grass roof, pebbles and strata bands in the dirt below —
  // makes the cut edge under the world read as real earth instead of a flat brown slab
  if (map[MAP_H-2]) {
    const seamSy = groundSy + 2*TILE;
    const strata = ctx.createLinearGradient(0, seamSy, 0, seamSy+2*TILE);
    strata.addColorStop(0, 'rgba(60,40,18,0.12)'); strata.addColorStop(1, 'rgba(40,26,10,0.28)');
    ctx.fillStyle = strata; ctx.fillRect(0, seamSy, GW, 2*TILE);
    for (let tx=stx; tx<etx; tx++) {
      const sx = tx*TILE - cx;
      const h = ((tx*37+13)%9);
      ctx.fillStyle='#6b4a2a';
      if (h<2) { ctx.fillRect(sx+3, seamSy, 2, 6+h*3); ctx.fillRect(sx+9-h, seamSy, 1, 4+h*2); }
      else if (h<4) { ctx.fillRect(sx+7, seamSy, 2, 5); }
      if (h===5) { ctx.fillStyle='#8a7a68'; ctx.fillRect(sx+5, seamSy+7, 3, 3); ctx.fillStyle='#6a5c4e'; ctx.fillRect(sx+5, seamSy+9, 3, 1); }
      if (h===7) { ctx.fillStyle='#9c8c78'; ctx.fillRect(sx+9, seamSy+14, 4, 3); }
    }
  }
  const FLOWER_HUES = [['#ffd040','#fff8b0'],['#ff6a9c','#ffc0d8'],['#8a6aff','#c8b8ff']];
  for (const obj of worldObjects) {
    const sx=obj.x-cx;
    if (sx<-40 || sx>GW+40) continue;
    if (obj.type==='tree') {
      const sway = Math.sin(S.time*0.02 + obj.seed)*1.4;
      const sc = obj.scale||1;
      groundShadow(sx, groundSy, 22*sc);
      if (sc===1) drawTree(sx, groundSy-24, obj.variant, sway);
      else { ctx.save(); ctx.translate(sx, groundSy-24); ctx.scale(sc,sc); drawTree(0,0,obj.variant,sway/sc); ctx.restore(); }
    }
    else if (obj.type==='bush') {
      const sway = Math.sin(S.time*0.03 + sx*0.1)*0.6;
      groundShadow(sx, groundSy, 12);
      ctx.fillStyle='#6a9040'; ctx.fillRect(sx-4+sway, groundSy-6, 8, 6);
      ctx.fillStyle='#7aaa48'; ctx.fillRect(sx-2+sway, groundSy-7, 4, 3);
    }
    else if (obj.type==='rock') {
      groundShadow(sx, groundSy, 9);
      ctx.fillStyle='#888'; ctx.fillRect(sx-2, groundSy-4, 5, 4);
      ctx.fillStyle='#999'; ctx.fillRect(sx-1, groundSy-3, 3, 2);
    }
    else if (obj.type==='flower') {
      const hue = FLOWER_HUES[obj.hue||0];
      ctx.fillStyle=hue[0]; ctx.fillRect(sx, groundSy-2, 2, 2);
      ctx.fillStyle=hue[1]; ctx.fillRect(sx, groundSy-3, 1, 1);
    }
    else if (obj.type==='hill') drawRockyHill(sx, groundSy, obj.seed);
    else if (obj.type==='fence') drawFence(sx, groundSy);
    else if (obj.type==='stump') drawStump(sx, groundSy);
    else if (obj.type==='tallgrass') {
      const sway = Math.sin(S.time*0.05 + sx*0.15)*1.6;
      drawTallGrass(sx, groundSy, sway, obj.tall);
    }
    else if (obj.type==='stream') drawStream(sx, groundSy, obj.w);
    else if (obj.type==='barn') drawBarnExterior(sx, groundSy);
    else if (obj.type==='windmill') drawWindmill(sx, groundSy, S.time);
    else if (obj.type==='well') drawWell(sx, groundSy);
    else if (obj.type==='hay') drawHayBale(sx, groundSy);
    else if (obj.type==='trough') drawTrough(sx, groundSy);
    else if (obj.type==='sign') drawSign(sx, groundSy, obj.label);
    else if (obj.type==='shed') drawShed(sx, groundSy);
    else if (obj.type==='cabbage') drawCabbagePatch(sx, groundSy);
    else if (obj.type==='carrotpatch') drawCarrotPatch(sx, groundSy);
  }

  // dust motes drifting through the warm morning light
  if (Math.random() < 0.04) S.dust.push({x:cx+Math.random()*GW, y:groundSy-60-Math.random()*80, vy:0.08+Math.random()*0.1, phase:Math.random()*Math.PI*2, life:300});
  for (let i=S.dust.length-1; i>=0; i--) {
    const d=S.dust[i]; d.y+=d.vy; d.phase+=0.02; d.life--;
    if (d.life<=0) { S.dust.splice(i,1); continue; }
    const dsx = d.x + Math.sin(d.phase)*6 - cx;
    if (dsx<-5 || dsx>GW+5) continue;
    ctx.fillStyle=`rgba(255,250,220,${Math.min(0.5,d.life/300)})`;
    ctx.fillRect(dsx, d.y, 1, 1);
  }

  // chimney smoke — barn + village houses, more life as tasks complete
  if (S.time % 45 === 0) {
    spawnSmoke(BARN_X-31, (MAP_H-4)*TILE-72);
    if (S.villageLife>=2) { spawnSmoke(72*TILE+16, (MAP_H-10)*TILE-4); spawnSmoke(84*TILE+16, (MAP_H-9)*TILE-4); }
  }
  updateDrawSmoke(cx, cy);

  // falling leaves from canopies
  if (Math.random() < 0.035) {
    const t = worldObjects.filter(o=>o.type==='tree');
    const src = t[Math.floor(Math.random()*t.length)];
    if (src) S.leaves.push({x:src.x+(Math.random()*10-5), y:(MAP_H-4)*TILE-34, vy:0.25+Math.random()*0.2, sway:Math.random()*Math.PI*2, life:200});
  }
  updateDrawLeaves(cx, cy);

  // butterflies
  for (const b of butterflies) {
    b.phase += 0.02*b.speed; b.wing += 0.35;
    const bx = (b.x*TILE + Math.sin(b.phase*1.3)*22) - cx;
    const by = (GH-MAP_H*TILE-cy) + (b.baseY*TILE) + Math.sin(b.phase*2)*10 - 6;
    if (bx>-10 && bx<GW+10) drawButterfly(bx, by, b.wing, b.phase%2<1?'#ffd94a':'#ff9ac0');
  }

  const groundY = GH - MAP_H*TILE - cy;
  for (const ch of chickenPositions) {
    ch.anim++; if (ch.anim%80<20) ch.peck=(ch.anim%20<5)?1:0; else ch.peck=0;
    const sx=ch.x*TILE-cx; if (sx>-10 && sx<GW+10)
      drawChicken(sx, groundY + ch.y*TILE, ch.dir, ch.anim, ch.peck);
  }
  for (const sh of sheepPositions) {
    sh.anim++; const sx=sh.x*TILE-cx;
    if (sx>-20 && sx<GW+20) drawSheep(sx, groundY + sh.y*TILE, sh.anim);
  }

  // farmer NPC
  farmerNPC.anim++;
  const fnSX = farmerNPC.x*TILE-cx;
  if (fnSX>-30 && fnSX<GW+30) drawFarmer(fnSX, groundY + farmerNPC.y*TILE, farmerNPC.dir, farmerNPC.anim);

  // villagers — scattered folks with small talk, greeted via E
  for (const v of villagerPositions) {
    v.anim++;
    const vsx = v.x*TILE - cx;
    if (vsx>-30 && vsx<GW+30) drawFarmer(vsx, groundY + v.y*TILE, v.dir, v.anim, v.pal);
  }

  for (const w of wheatItems) {
    if (w.collected) continue;
    const wx=w.x-cx, wy=w.y-cy+GH-MAP_H*TILE;
    ctx.fillStyle='#c4a020'; ctx.fillRect(wx-1, wy-10, 2, 12);
    ctx.fillStyle='#d4b030'; ctx.fillRect(wx, wy-12, 2, 4);
    const a=0.3+0.3*Math.sin(S.time*0.06+wx);
    ctx.fillStyle=`rgba(255,255,200,${a})`; ctx.fillRect(wx, wy-14, 2, 2);
  }

  // world-life extras: village children waving once the community has been helped
  if (S.villageLife>=3) {
    for (const h of deliveryHouses) {
      const sx = h.x*TILE - cx + 26, sy = groundY + (h.y+6)*TILE;
      const wave = Math.sin(S.time*0.08)*2;
      ctx.fillStyle='#e8c090'; ctx.fillRect(sx, sy, 5, 8);
      ctx.fillStyle='#d04030'; ctx.fillRect(sx, sy-3, 5, 4);
      ctx.fillStyle='#e8c090'; ctx.fillRect(sx+5, sy+1+wave, 2, 3);
    }
  }
}

// ── BARN INTERIOR — a small, cozy, non-scrolling room. Reuses the outside ground-line math
// (GH - MAP_H*TILE) so the floor sits at the exact same screen row as the outside grass line,
// meaning every entity's existing y-grounding still lines up correctly in here. ──
function drawBarnInterior() {
  const groundY = GH - MAP_H*TILE;   // same reference drawWorld uses at cy=0
  const floorY = GH - 4*TILE;        // 206 — where wall meets floor

  // dim, warm wood-plank walls
  const wallGrad = ctx.createLinearGradient(0,0,0,floorY);
  wallGrad.addColorStop(0,'#392a1e'); wallGrad.addColorStop(1,'#4c3627');
  ctx.fillStyle = wallGrad; ctx.fillRect(0,0,GW,floorY);
  for (let x=0; x<GW; x+=14) {
    ctx.fillStyle='rgba(255,255,255,0.035)'; ctx.fillRect(x+2,0,6,floorY);
    ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.fillRect(x,0,2,floorY);
  }

  // roof beams
  ctx.fillStyle='#241708'; ctx.fillRect(0,9,GW,7);
  ctx.fillStyle='#1c1206'; ctx.fillRect(0,14,GW,2);
  for (let x=16; x<GW; x+=88) { ctx.fillStyle='#2e2011'; ctx.fillRect(x,9,7,38); }

  // glowing cracks — a couple of gaps in the wall letting daylight spill through
  for (const cx0 of [148, 396]) {
    const flick = 0.66+0.14*Math.sin(S.time*0.045+cx0);
    const glow = ctx.createRadialGradient(cx0, floorY*0.55, 4, cx0, floorY*0.55, 74);
    glow.addColorStop(0, `rgba(255,222,150,${0.32*flick})`); glow.addColorStop(1, 'rgba(255,222,150,0)');
    ctx.fillStyle=glow; ctx.fillRect(cx0-74,16,148,floorY-16);
    ctx.fillStyle=`rgba(255,240,205,${0.85*flick})`;
    ctx.fillRect(cx0-1, 22, 2, floorY-30); ctx.fillRect(cx0+4, 70, 1, floorY-90);
  }

  // wood-plank floor
  ctx.fillStyle='#5a4230'; ctx.fillRect(0, floorY, GW, GH-floorY);
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(0, floorY, GW, 2);
  for (let x=0; x<GW; x+=22) { ctx.fillStyle='rgba(0,0,0,0.14)'; ctx.fillRect(x, floorY, 1, GH-floorY); }

  // a small puddle on the floor
  ctx.fillStyle='#33454e'; ctx.fillRect(322, floorY+13, 28, 9);
  ctx.fillStyle='#43606b'; ctx.fillRect(326, floorY+14, 20, 5);
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(329, floorY+14, 7, 1);

  // hay bales piled around
  drawHayBale(58, floorY); drawHayBale(74, floorY); drawHayBale(452, floorY);

  // interior door back outside — warm light bleeds around the frame
  const dGlow = ctx.createRadialGradient(INTERIOR_DOOR_X, floorY-14, 2, INTERIOR_DOOR_X, floorY-14, 34);
  dGlow.addColorStop(0,'rgba(255,228,176,0.38)'); dGlow.addColorStop(1,'rgba(255,228,176,0)');
  ctx.fillStyle=dGlow; ctx.fillRect(INTERIOR_DOOR_X-34, floorY-48, 68, 48);
  ctx.fillStyle='#241708'; ctx.fillRect(INTERIOR_DOOR_X-9, floorY-23, 18, 23);
  ctx.fillStyle='#4a3020'; ctx.fillRect(INTERIOR_DOOR_X-8, floorY-22, 16, 22);
  ctx.fillStyle='#e8d090'; ctx.fillRect(INTERIOR_DOOR_X+4, floorY-13, 2, 2);

  // the whole herd lives here now
  for (const cow of cowPositions) { cow.anim++; drawCow(cow.x*TILE, groundY + cow.y*TILE, cow.dir, cow.anim); }
  farmCow.anim++; drawCow(farmCow.x*TILE, groundY + farmCow.y*TILE, farmCow.dir, farmCow.anim);

  // soft vignette — dim corners, warm middle
  const vig = ctx.createRadialGradient(GW/2, floorY*0.55, 50, GW/2, floorY*0.55, 340);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,GW,GH);
}

// ── SMOKE / LEAVES (lightweight, generic drift particles) ──
function spawnSmoke(x,y){ S.smoke.push({x,y,vx:(Math.random()-0.5)*0.15,vy:-0.25-Math.random()*0.15,life:120,size:2}); }
function updateDrawSmoke(cx,cy){
  for(let i=S.smoke.length-1;i>=0;i--){
    const p=S.smoke[i]; p.x+=p.vx; p.y+=p.vy; p.size+=0.02; p.life--;
    if(p.life<=0){ S.smoke.splice(i,1); continue; }
    const a=Math.min(0.35,p.life/200);
    const sx=p.x-cx, sy=p.y-cy+GH-MAP_H*TILE;
    ctx.fillStyle=`rgba(220,220,220,${a})`; ctx.fillRect(sx-p.size/2, sy-p.size/2, p.size, p.size);
  }
}
function updateDrawLeaves(cx,cy){
  for(let i=S.leaves.length-1;i>=0;i--){
    const l=S.leaves[i]; l.y+=l.vy; l.sway+=0.05; l.life--;
    if(l.life<=0){ S.leaves.splice(i,1); continue; }
    const sx=(l.x+Math.sin(l.sway)*8)-cx, sy=l.y-cy+GH-MAP_H*TILE;
    ctx.fillStyle='#c47a2a'; ctx.fillRect(sx, sy, 2, 2);
  }
}

// ── PARTICLES ──
function spawnParticles(x,y,c,n) {
  for(let i=0;i<n;i++) S.particles.push({x,y,vx:(Math.random()-0.5)*3,vy:-Math.random()*4-1,life:25+Math.random()*20,c});
}
function spawnFloatText(x,y,text,color) {
  S.floatTexts.push({x,y,text,color:color||'#fff5d0',life:50,vy:-0.6});
}
function updateParticles() {
  for(let i=S.particles.length-1;i>=0;i--) {
    const p=S.particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--; if(p.life<=0)S.particles.splice(i,1);
  }
  for(let i=S.floatTexts.length-1;i>=0;i--){
    const t=S.floatTexts[i]; t.y+=t.vy; t.life--; if(t.life<=0)S.floatTexts.splice(i,1);
  }
}
function drawParticles() {
  for(const p of S.particles) {
    const a=Math.min(1,p.life/15);
    ctx.fillStyle=p.c.replace('1)',a+')'); ctx.fillRect(p.x-S.camX,p.y-S.camY+GH-MAP_H*TILE,2,2);
  }
  ctx.font='8px monospace'; ctx.textAlign='center';
  for(const t of S.floatTexts) {
    const a=Math.min(1,t.life/20);
    ctx.fillStyle=t.color.replace(')', `,${a})`).replace('rgb','rgba');
    ctx.fillStyle = t.color; ctx.globalAlpha=a;
    ctx.fillText(t.text, t.x-S.camX, t.y-S.camY+GH-MAP_H*TILE);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

// ── DIALOGUE ──
const DIA_CONTINUE_DEFAULT = diaContinue.innerHTML;
function showDialogue(texts,speaker,cb) {
  S.dialogue=true; S.dialogueQueue=Array.isArray(texts)?texts:[texts]; S.diaCb=cb||null;
  S.choiceOptions=null; diaChoices.classList.remove('active'); diaText.style.display='';
  diaContinue.innerHTML=DIA_CONTINUE_DEFAULT;
  diaBox.classList.add('active'); diaName.textContent=speaker||''; diaText.textContent=S.dialogueQueue[0];
}
function advanceDialogue() {
  S.dialogueQueue.shift();
  if(S.dialogueQueue.length>0) diaText.textContent=S.dialogueQueue[0];
  else { S.dialogue=false; diaBox.classList.remove('active'); if(S.diaCb){const c=S.diaCb;S.diaCb=null;c();} }
}

// ── DIALOGUE CHOICES: a short list of responses the player can pick with Up/Down + Enter, or 1-9 ──
function showChoices(options, speaker) {
  S.dialogue=true; S.choiceOptions=options; S.choiceIndex=0; S.choiceSpeaker=speaker||'';
  diaBox.classList.add('active'); diaName.textContent=speaker||'';
  diaText.style.display='none';
  diaContinue.textContent='▲▼ Choose · Enter Select';
  diaChoices.classList.add('active');
  renderChoices();
}
function renderChoices() {
  diaChoices.innerHTML = S.choiceOptions.map((o,i)=>
    `<div class="dialogue-choice${i===S.choiceIndex?' sel':''}">${i+1}. ${o.label}</div>`).join('');
}
function moveChoice(delta) {
  if(!S.choiceOptions) return;
  S.choiceIndex = (S.choiceIndex + delta + S.choiceOptions.length) % S.choiceOptions.length;
  renderChoices();
}
function confirmChoice(idx) {
  if(!S.choiceOptions) return;
  const opt = S.choiceOptions[idx!==undefined ? idx : S.choiceIndex];
  if(!opt) return;
  const speaker = S.choiceSpeaker;
  S.choiceOptions=null; diaChoices.classList.remove('active'); diaText.style.display='';
  showDialogue(opt.response, speaker, ()=>{});
}

// ── STORY PANELS (historical interludes) ──
function showStoryPanel(year,title,text,cb) {
  cinematic.classList.remove('hidden'); S.playing=false;
  cinematic.innerHTML=`<div class="cin-logo">QUMËSHTORJA VITA</div><div class="cin-year" style="font-size:clamp(42px,6vw,72px)">${year}</div><div class="cin-title">${title}</div><div class="cin-divider"></div><div class="cin-story">${text}</div><button class="cin-btn" id="sb">Continue</button>`;
  document.getElementById('sb').onclick=()=>{cinematic.classList.add('hidden');S.playing=true;cb();};
}

// ── TASK COMPLETION ──
function completeTask(idx) {
  spawnParticles(S.px,S.py,'rgba(255,215,0,1)',25);
  if(idx===0){
    S.villageLife=1;
    showDialogue([
      'Ah— good morning, mikunë. Another day, another sunrise over Istog.',
      'These hands have milked cows since before you were born. But today feels different somehow.',
      'Would you lend me a hand today? Start by gathering some wheat from the field — the cows are hungry.'
    ],'Farmer Hashim',()=>{S.currentTask=1;S.taskProgress=0;S.taskTarget=TASK_TARGET[1];updateTaskBar();});
  }
  else if(idx===1){
    S.villageLife=2;
    showDialogue(['Good, good — that’s plenty wheat. The cows are waiting in the barn — press E at the door to go in, then feed one.'],'Farmer Hashim',()=>{S.currentTask=2;updateTaskBar();});
  }
  else if(idx===2){
    S.villageLife=3; S.currentTask=3; S.taskProgress=0; S.taskTarget=TASK_TARGET[3];
    showDialogue(['Good — she\'s got her feed. Now walk up to any cow and hold E to milk her. Each one only gives once, so you\'ll need to visit a few.'],'Farmer Hashim',()=>{S.milkReady=true;updateTaskBar();});
  }
  else if(idx===3){
    showDialogue(['There we go. Fresh, warm milk — nature’s gift. Head back out through the door and carry the bottles into the village — press E to sell them.'],'Farmer Hashim',()=>{S.currentTask=4;S.taskProgress=0;S.taskTarget=TASK_TARGET[4];updateTaskBar();});
  }
  else if(idx===4){
    S.villageLife=4;
    S.levelComplete=true;
    updateTaskBar();
    startEnding();
  }
}

// ── ENDING CUTSCENE ──
let ending=null;
function startEnding(){
  ending = {phase:'rise', t:0, wagonX:20*TILE};
}
function updateEnding(){
  if(!ending) return;
  ending.t++;
  if(ending.phase==='rise' && ending.t>90){ ending.phase='wagon'; ending.t=0; }
  else if(ending.phase==='wagon'){
    ending.wagonX += 0.9;
    if(ending.wagonX > 96*TILE){ ending.phase='fade'; ending.t=0; }
  }
  else if(ending.phase==='fade' && ending.t===1){
    endFade.classList.add('on');
  }
  else if(ending.phase==='fade' && ending.t>150){
    ending.phase='panel'; ending.t=0;
    endFade.classList.remove('on');
    showStoryPanel('2003','The Foundation Is Laid','From farmers like this one, from thousands of families across Kosovo\'s highlands, VITA was born.<br><br>Devolli Group\'s vision — combined with Tetra Pak\'s technology — would soon transform these humble milk deliveries into the largest dairy in the Balkans.<br><br>280 employees. 1,500+ farmers. One promise: Fresh from nature. Trusted every day.<br><br><span style="color:var(--blue);font-weight:700">Level 1 Complete</span><br><span style="font-size:11px;color:var(--text-dim)">VITA — Burim i jetës</span>',
      ()=>{
        initGame();
        cinematic.classList.remove('hidden');
        cinematic.innerHTML=`<div class="cin-logo">QUMËSHTORJA VITA</div><div class="cin-year" style="font-size:clamp(34px,5vw,52px)">VITA</div><div class="cin-title">Level 1 Complete</div><div class="cin-divider"></div><div class="cin-story" style="color:var(--blue-dark);font-weight:500">"VITA është qumështi i parë, në Kosovë, i përpunuar me teknologjinë më moderne UHT."<br><br><span style="color:var(--text-dim)">— Me ty u rrita —</span></div><button class="cin-btn" onclick="location.reload()">Play Again</button><div class="cin-sub">Level 2 coming soon…</div>`;
        ending=null;
      });
  }
}
function renderEnding(){
  if(!ending) return;
  const riseAmt = ending.phase==='rise' ? Math.min(1, ending.t/90) : 1;
  const camY = -riseAmt*70;
  const camX = Math.max(0, Math.min(MAP_W*TILE-GW, ending.wagonX - GW/2));
  ctx.clearRect(0,0,GW,GH);
  drawWorld(camX, camY);
  if(ending.phase==='wagon' || ending.phase==='fade'){
    const groundY = GH - MAP_H*TILE - camY;
    const wx = ending.wagonX - camX;
    const wy = groundY + (MAP_H-4)*TILE - 16;
    drawWagon(wx, wy);
  }
  drawParticles();
}
function drawWagon(x,y){
  ctx.fillStyle='#6B4226'; ctx.fillRect(x-10,y-6,24,10);
  ctx.fillStyle='#8B5A2E'; ctx.fillRect(x-10,y-9,24,3);
  ctx.fillStyle='#2a2a2a'; ctx.fillRect(x-8,y+3,6,6); ctx.fillRect(x+6,y+3,6,6);
  ctx.fillStyle='#555'; ctx.fillRect(x-6,y+5,2,2); ctx.fillRect(x+8,y+5,2,2);
  // milk can
  ctx.fillStyle='#d8dde2'; ctx.fillRect(x-3,y-16,10,9);
  ctx.fillStyle='#0057B8'; ctx.fillRect(x-3,y-13,10,2);
  ctx.fillStyle='#eef3f7'; ctx.fillRect(x-1,y-15,3,3);
}

// ── UPDATE ──
function allCows(){ return [farmCow, ...cowPositions]; }
function update() {
  const p=S; if(p.dialogue||p.intro||p.levelComplete)return;
  p.time++;

  p.vx=0;
  if(p.keys.ArrowLeft&&!p.keys.ArrowRight){p.vx=-SPEED;p.facing=-1;}
  if(p.keys.ArrowRight&&!p.keys.ArrowLeft){p.vx=SPEED;p.facing=1;}
  if((p.keys.ArrowUp||p.keys[' '])&&p.onGround&&!p.jumping){p.vy=JUMP;p.onGround=false;p.jumping=true;}
  if(!p.keys[' ']&&!p.keys.ArrowUp)p.jumping=false;
  p.vy+=GRAVITY; p.px+=p.vx; p.py+=p.vy;
  const worldWTiles = p.scene==='barn' ? ROOM_W_TILES : MAP_W;
  p.px=Math.max(0,Math.min(worldWTiles*TILE-PW,p.px));

  const groundY=(MAP_H-4)*TILE-PH;
  if(p.py>=groundY){p.py=groundY;p.vy=0;p.onGround=true;}
  if(p.py<0){p.py=0;p.vy=0;}
  if(p.vx!==0){
    p.animTimer++;
    if(p.animTimer>4){
      p.animTimer=0; p.animFrame++;
      if(p.onGround && p.animFrame%2===0) footstepSound();
    }
  } else p.animFrame=0;

  p.camX=p.px-GW/2+PW/2; p.camX=Math.max(0,Math.min(worldWTiles*TILE-GW,p.camX));
  p.camY=Math.min(0,p.py-GH/2);

  if(p.sceneCooldown>0) p.sceneCooldown--;

  // barn door — press E to step inside / step back out
  if(p.scene==='outside' && p.sceneCooldown<=0){
    const near = Math.abs(p.px+PW/2-BARN_DOOR_X)<16 && p.onGround;
    if(near && p.keys['e']){
      p.keys['e']=false; p.keys['E']=false;
      p.scene='barn'; p.px=INTERIOR_DOOR_X+18; p.py=groundY; p.vy=0; p.sceneCooldown=20;
      updateTaskBar();
    }
  } else if(p.scene==='barn' && p.sceneCooldown<=0){
    const near = Math.abs(p.px+PW/2-INTERIOR_DOOR_X)<16 && p.onGround;
    if(near && p.keys['e']){
      p.keys['e']=false; p.keys['E']=false;
      p.scene='outside'; p.px=BARN_DOOR_X-7; p.py=groundY; p.vy=0; p.sceneCooldown=20;
      updateTaskBar();
    }
  }

  // meet the farmer — approaching him starts the story naturally
  if(p.scene==='outside' && p.currentTask===0 && !farmerNPC.talked){
    const dx=Math.abs(p.px+PW/2-(farmerNPC.x*TILE+8)), dy=Math.abs(p.py+PH/2-(farmerNPC.y*TILE+8));
    if(dx<28 && dy<32){ farmerNPC.talked=true; completeTask(0); }
  }
  // wheat — hold E next to a stalk; a ring fills (quicker than milking), then it's added to the inventory
  if(p.scene==='outside' && p.currentTask===1){
    const w = wheatItems.find(w=>!w.collected && Math.abs(p.px+PW/2-w.x)<12 && Math.abs(p.py+PH/2-w.y)<24);
    if(w && p.keys['e']){
      p.wheatHold++;
      if(p.wheatHold>=18){
        p.wheatHold=0; w.collected=true; p.taskProgress++; p.inventory.wheat++;
        spawnParticles(w.x,w.y,'rgba(255,215,0,1)',10); spawnFloatText(w.x,w.y-16,'+1 wheat'); pickupSound(); updateTaskBar();
        if(p.taskProgress>=TASK_TARGET[1]) completeTask(1);
      }
    } else p.wheatHold=0;
  } else p.wheatHold=0;
  // feed a cow — inside the barn, press E next to any unfed cow, consumes 1 wheat from the inventory
  if(p.scene==='barn' && p.currentTask===2){
    const cow = allCows().find(c=>!c.fed && Math.abs(p.px+PW/2-(c.x*TILE+TILE/2))<28 && Math.abs(p.py+PH/2-(c.y*TILE+TILE/2))<28);
    if(cow && p.keys['e']){
      p.keys['e']=false; p.keys['E']=false;
      const cx=cow.x*TILE+TILE/2, cy=cow.y*TILE+TILE/2;
      if(p.inventory.wheat>0){
        cow.fed=true; p.inventory.wheat--;
        spawnParticles(cx,cy,'rgba(100,200,100,1)',18); spawnFloatText(cx,cy-20,'-1 wheat','#ffe08a'); cowbellSound(); updateTaskBar();
        if(!p.cowFed){
          p.cowFed=true; p.taskProgress++;
          showDialogue(['There you go — eat up. Fresh milk will come soon.'],'Farmer Hashim',()=>{completeTask(2);});
        }
      } else {
        showDialogue(["I don't have any wheat to feed her yet — better go gather some outside."],'You',()=>{});
      }
    }
  }
  // milk — inside the barn, hold E next to any un-milked cow; a ring fills, then a bottle drops into the inventory.
  // Each cow only gives milk once — move on to a different one after.
  if(p.scene==='barn' && p.currentTask===3 && p.milkReady){
    const cow = allCows().find(c=>!c.milked && Math.abs(p.px+PW/2-(c.x*TILE+TILE/2))<28 && Math.abs(p.py+PH/2-(c.y*TILE+TILE/2))<28);
    if(cow && p.keys['e']){
      p.milkHold++;
      if(p.milkHold>=35){
        p.milkHold=0; cow.milked=true; p.taskProgress++; p.inventory.milk++;
        const cx=cow.x*TILE+TILE/2, cy=cow.y*TILE+TILE/2;
        spawnParticles(cx,cy+20,'rgba(255,255,255,1)',12); spawnFloatText(cx,cy-4,'+1 milk','#d8f0ff'); milkSound(); updateTaskBar();
        if(p.taskProgress>=TASK_TARGET[3]) completeTask(3);
      }
    } else p.milkHold=0;
  } else p.milkHold=0;
  // sell — outside, press E at a village house door, consumes a bottle from the inventory
  // (h.y is the house's roofline, used for the decorative wave sprite — the door trigger sits at ground level instead)
  if(p.scene==='outside' && p.currentTask===4){
    for(const h of deliveryHouses){
      const hx=h.x*TILE+TILE, hy=(MAP_H-6)*TILE;
      const near = Math.abs(p.px+PW/2-hx)<22 && Math.abs(p.py+PH/2-hy)<26;
      if(near && p.keys['e']){
        p.keys['e']=false; p.keys['E']=false;
        if(p.inventory.milk>0){
          p.inventory.milk--; p.taskProgress++;
          spawnParticles(hx,hy,'rgba(100,180,255,1)',14); chimeSound(); updateTaskBar();
          showDialogue(['Faleminderit! The milk is fresh and delicious. Your farm is a blessing to this village.'],'Neighbour',()=>{});
          if(p.taskProgress>=TASK_TARGET[4]) completeTask(4);
        } else {
          showDialogue(["You're out of milk to sell — go fetch more from the cow."],'You',()=>{});
        }
      }
    }
  }

  // petting non-task animals — pure delight, no progression. Sheep/chickens outside.
  // Barn cows only join the pettable pool once fully milked — otherwise this steals the E hold from feed/milk every frame.
  if(p.petCooldown>0) p.petCooldown--;
  if(p.keys['e'] && p.petCooldown<=0){
    const pool = p.scene==='barn' ? allCows().filter(c=>c.milked) : [...sheepPositions,...chickenPositions];
    const near = pool.find(a=>{
      const ax=a.x*TILE+8, ay=a.y*TILE+8;
      return Math.abs(p.px+PW/2-ax)<20 && Math.abs(p.py+PH/2-ay)<20;
    });
    if(near){ p.petCooldown=30; p.keys['e']=false; p.keys['E']=false; spawnParticles(near.x*TILE+8,near.y*TILE,'rgba(255,140,180,1)',8); petSound(); }
  }

  // villager small-talk — outside, press E near a villager to greet them
  if(p.scene==='outside' && p.keys['e']){
    const v = villagerPositions.find(v=>{
      const vx=v.x*TILE+8, vy=v.y*TILE+8;
      return Math.abs(p.px+PW/2-vx)<24 && Math.abs(p.py+PH/2-vy)<28;
    });
    if(v){ p.keys['e']=false; p.keys['E']=false; showDialogue(v.greet(), v.name, ()=>showChoices(v.choices(), v.name)); }
  }
}

// ── INTERACT PROMPTS (Zelda-style bubble, replaces HUD) ──
function drawPrompt(wx, wy, label) {
  label = label || 'ENTER';
  const bob = Math.sin(S.time*0.15)*2;
  const sx = wx-S.camX, sy = wy-S.camY+GH-MAP_H*TILE-26+bob;
  const w = 10 + label.length*6;
  ctx.fillStyle='rgba(18,58,111,0.85)'; ctx.fillRect(sx-w/2,sy-7,w,11);
  ctx.fillStyle='rgba(18,58,111,0.85)'; ctx.fillRect(sx-2,sy+3,4,4);
  ctx.fillStyle='#fff'; ctx.font='7px monospace'; ctx.textAlign='center';
  ctx.fillText(label, sx, sy);
  ctx.textAlign='left';
}
function drawHoldRing(wx, wy, frac) {
  const sx = wx-S.camX, sy = wy-S.camY+GH-MAP_H*TILE-54, r=9;
  ctx.lineWidth=3; ctx.lineCap='round';
  ctx.strokeStyle='rgba(18,58,111,0.45)';
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#d8f0ff';
  ctx.beginPath(); ctx.arc(sx,sy,r,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.stroke();
  ctx.lineWidth=1; ctx.lineCap='butt';
}
function drawPrompts(){
  if(S.dialogue||S.intro||S.levelComplete) return;
  const p=S;
  if(p.scene==='outside' && p.sceneCooldown<=0){
    if(Math.abs(p.px+PW/2-BARN_DOOR_X)<16) drawPrompt(BARN_DOOR_X,(MAP_H-4)*TILE-30,'E');
  }
  if(p.scene==='barn' && p.sceneCooldown<=0){
    if(Math.abs(p.px+PW/2-INTERIOR_DOOR_X)<16) drawPrompt(INTERIOR_DOOR_X,(MAP_H-4)*TILE-30,'E');
  }
  if(p.scene==='outside' && p.currentTask===1){
    const w = wheatItems.find(w=>!w.collected && Math.abs(p.px+PW/2-w.x)<12 && Math.abs(p.py+PH/2-w.y)<24);
    if(w){
      drawPrompt(w.x,w.y-14,'HOLD E');
      if(p.wheatHold>0) drawHoldRing(w.x,w.y+2,p.wheatHold/18);
    }
  }
  if(p.scene==='barn' && p.currentTask===2){
    const cow = allCows().find(c=>!c.fed && Math.abs(p.px+PW/2-(c.x*TILE+TILE/2))<28 && Math.abs(p.py+PH/2-(c.y*TILE+TILE/2))<28);
    if(cow) drawPrompt(cow.x*TILE+TILE/2,cow.y*TILE+TILE/2-10,'E');
  }
  if(p.scene==='barn' && p.currentTask===3 && p.milkReady){
    const cow = allCows().find(c=>!c.milked && Math.abs(p.px+PW/2-(c.x*TILE+TILE/2))<28 && Math.abs(p.py+PH/2-(c.y*TILE+TILE/2))<28);
    if(cow){
      const cx=cow.x*TILE+TILE/2, cy=cow.y*TILE+TILE/2;
      drawPrompt(cx,cy-10,'HOLD E');
      if(p.milkHold>0) drawHoldRing(cx,cy,p.milkHold/35);
    }
  }
  if(p.scene==='outside' && p.currentTask===4){
    for(const h of deliveryHouses){
      const hx=h.x*TILE+TILE, hy=(MAP_H-6)*TILE;
      if(Math.abs(p.px+PW/2-hx)<22&&Math.abs(p.py+PH/2-hy)<26) drawPrompt(hx,hy-10,'E');
    }
  }
  if(p.scene==='outside') for(const v of villagerPositions){
    const vx=v.x*TILE+8, vy=v.y*TILE+8;
    if(Math.abs(p.px+PW/2-vx)<24&&Math.abs(p.py+PH/2-vy)<28) drawPrompt(vx,vy-16,'E');
  }
}

// ── RENDER ──
function render() {
  if(S.intro){ renderHistoryBg(); requestAnimationFrame(render); return; }
  if(ending){ renderEnding(); updateParticles(); requestAnimationFrame(render); return; }

  ctx.clearRect(0,0,GW,GH);
  if (S.scene==='barn') drawBarnInterior(); else drawWorld(S.camX,S.camY);
  drawPlayer(S.px-S.camX, S.py-S.camY+GH-MAP_H*TILE);
  drawPrompts();
  drawParticles();

  if (S.scene==='outside') {
    const birdX=((S.time*0.3)%(GW+60))-30, birdY=25+Math.sin(S.time*0.02)*8;
    ctx.fillStyle='#333'; ctx.fillRect(birdX,birdY,4,2); ctx.fillRect(birdX-2,birdY+1,3,1);
    if((S.time+90)%180<90){const b2X=((S.time*0.25+100)%(GW+60))-30;ctx.fillRect(b2X,birdY+10,4,2);}
  }

  requestAnimationFrame(render);
}

// ── HISTORY SCREEN (real VITA founding story, 1989 → 2003) ──
// Only verified public facts are used — no invented dates or events.
const HISTORY_CARDS = [
  {year:'1989', text:'In a small corner of Kosovo, the Devolli family opens a modest trading business — Devolli Commerce. Their promise: honest products, at a fair price.'},
  {year:'1990s', text:'Through the decade, that promise travels from town to town. Shelf by shelf, Devolli earns the trust of families across Kosovo.'},
  {year:'Early 2000s', text:'The Devolli family looks toward the hills of Istog with a new ambition — not just to deliver products, but to make one of their own.'},
  {year:'Nov 19, 2003', text:'In partnership with Sweden’s Tetra Pak, Kosovo’s first UHT milk production line begins to turn. A new name is born: VITA.'},
];
let historyIdx = 0, historyActive = true;
function showHistoryCard(i){
  historyIdx = i;
  historyYear.textContent = HISTORY_CARDS[i].year;
  historyText.textContent = HISTORY_CARDS[i].text;
  historyCard.classList.remove('in'); void historyCard.offsetWidth; historyCard.classList.add('in');
}
function advanceHistory(){
  if(!historyActive) return;
  if(historyIdx < HISTORY_CARDS.length-1) showHistoryCard(historyIdx+1);
  else { historyActive=false; finishHistory(); }
}
function finishHistory(){
  historyScreen.classList.add('hidden');
  yearFlash.classList.add('show');
  setTimeout(()=>{ S.intro=false; startGame(); yearFlash.classList.remove('show'); }, 1500);
  setTimeout(()=>{ yearFlash.style.display='none'; }, 2000);
}
showHistoryCard(0);

// Gentle ambient backdrop (sun, sky, hills) behind the history screen — no gameplay elements
let bgT = 0;
function renderHistoryBg(){
  bgT++;
  ctx.clearRect(0,0,GW,GH);
  const g1 = ctx.createLinearGradient(0,0,0,GH*0.6);
  g1.addColorStop(0,'#3a6fb8'); g1.addColorStop(0.5,'#6898d8'); g1.addColorStop(1,'#90b8e8');
  ctx.fillStyle=g1; ctx.fillRect(0,0,GW,GH*0.6);
  const g2 = ctx.createLinearGradient(0,GH*0.6,0,GH);
  g2.addColorStop(0,'#90b8e8'); g2.addColorStop(0.3,'#c8ddf0'); g2.addColorStop(0.7,'#eaf4ff'); g2.addColorStop(1,'#dcecf8');
  ctx.fillStyle=g2; ctx.fillRect(0,GH*0.6,GW,GH*0.4);

  const sunX = 240, sunY = 40 + Math.sin(bgT*0.004)*2;
  ctx.fillStyle='rgba(255,252,235,0.3)'; ctx.fillRect(sunX-14, sunY-14, 32, 32);
  ctx.fillStyle='#fffdf0'; ctx.fillRect(sunX-7, sunY-7, 16, 16);
  ctx.fillStyle='#ffffff'; ctx.fillRect(sunX-3, sunY-3, 8, 8);

  for (let i=0; i<6; i++) {
    const clX = ((i*120 + bgT*0.06 + 200) % (GW+200)) - 100;
    const clY = 15+i*18, w=20+i*12;
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(clX, clY, w, 8);
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillRect(clX+4, clY-4, w-6, 6);
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fillRect(clX+2, clY+4, w-4, 3);
  }
  for (let mx=-20; mx<GW+60; mx+=10){ const mxA=mx-(bgT*0.03)%10; const mh=35+Math.sin(mx*0.12)*18+Math.sin(mx*0.06)*25; ctx.fillStyle='#c0dcc0'; ctx.fillRect(mxA, GH-mh+48, 10, mh); }
  for (let mx=-15; mx<GW+50; mx+=8){ const mxA=mx-(bgT*0.06)%8; const mh=24+Math.sin(mx*0.18+1)*14+Math.sin(mx*0.08)*20; ctx.fillStyle='#9cc89c'; ctx.fillRect(mxA, GH-mh+44, 8, mh); }
  for (let mx=-10; mx<GW+40; mx+=6){ const mxA=mx-(bgT*0.1)%6; const mh=16+Math.sin(mx*0.22+2)*10+Math.sin(mx*0.1)*14; ctx.fillStyle='#7ab87a'; ctx.fillRect(mxA, GH-mh+40, 6, mh); }

  const birdX=((bgT*0.3)%(GW+60))-30, birdY=25+Math.sin(bgT*0.02)*8;
  ctx.fillStyle='#333'; ctx.fillRect(birdX,birdY,4,2); ctx.fillRect(birdX-2,birdY+1,3,1);
  if((bgT+90)%180<90){const b2X=((bgT*0.25+100)%(GW+60))-30;ctx.fillRect(b2X,birdY+10,4,2);}
}

// ── INIT ──
function initGame() {
  S.px=140; S.py=(MAP_H-4)*TILE-PH; S.vx=0; S.vy=0; S.facing=1; S.onGround=true;
  S.animFrame=0; S.animTimer=0; S.jumping=false;
  S.currentTask=0; S.taskProgress=0; S.taskTarget=0;
  S.cowFed=false; S.milkReady=false; S.milkHold=0; S.wheatHold=0;
  S.inventory={wheat:0, milk:0};
  S.scene='outside'; S.sceneCooldown=0;
  S.choiceOptions=null; diaChoices.classList.remove('active');
  S.particles=[]; S.floatTexts=[]; S.smoke=[]; S.leaves=[]; S.dust=[];
  S.camX=0; S.camY=0;
  S.dialogue=false; S.levelComplete=false; S.keys={}; S.time=0; S.villageLife=0; S.petCooldown=0;
  buildWorld();
  updateTaskBar();
}

function startGame() {
  S.playing=true;
  initGame();
  showDialogue([
    'Mm— morning already. The mountains never let me sleep in.',
    'Come, walk with me a while.'
  ],'Farmer Hashim',()=>{});
}

// ── KEY HANDLING ──
window.addEventListener('keydown',e=>{
  S.keys[e.key]=true; S.keys[e.key.toLowerCase()]=true;
  tryFullscreen();
  if(S.intro){ advanceHistory(); return; }
  if(S.choiceOptions){
    if(e.key==='ArrowUp'){e.preventDefault(); moveChoice(-1); return;}
    if(e.key==='ArrowDown'){e.preventDefault(); moveChoice(1); return;}
    if(e.key==='Enter'){e.preventDefault(); confirmChoice(); return;}
    const n = parseInt(e.key,10);
    if(!isNaN(n) && n>=1 && n<=S.choiceOptions.length){ confirmChoice(n-1); return; }
    return;
  }
  if(e.key==='Enter'){e.preventDefault();if(S.dialogue)advanceDialogue();}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
});
window.addEventListener('keyup',e=>{S.keys[e.key]=false; S.keys[e.key.toLowerCase()]=false; if(e.key===' ')S.jumping=false;});

window.addEventListener('click',()=>{
  tryFullscreen();
  if(S.intro) advanceHistory();
});

// Touch controls for mobile
window.addEventListener('touchstart',e=>{e.preventDefault();
  if(S.intro){ advanceHistory(); return; }
  const t=e.touches[0],rect=canvas.getBoundingClientRect();
  const rx=(t.clientX-rect.left)/rect.width*GW,ry=(t.clientY-rect.top)/rect.height*GH;
  if(rx<GW/3)S.keys.ArrowLeft=true;else if(rx>GW*2/3)S.keys.ArrowRight=true;
  if(ry<GH*0.4)S.keys[' ']=true;if(ry>GH*0.7){S.keys.Enter=true;S.keys['e']=true;S.keys['E']=true;}});

window.addEventListener('touchend',e=>{e.preventDefault();S.keys.ArrowLeft=false;S.keys.ArrowRight=false;S.keys[' ']=false;S.keys.Enter=false;S.keys['e']=false;S.keys['E']=false;});

// ── GAME LOOP ──
initGame();
initAudio(); // context starts suspended; first click/keydown (on the history screen) unlocks it
render();
setInterval(()=>{if(S.playing)update();updateParticles();},1000/60);
</script>
